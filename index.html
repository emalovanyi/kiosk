<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GymBeam Kiosk – vyzdvihnutie objednávky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
:root{
  --stage-bg:#E3E3E8;--stage-ink:#1D1D1F;--panel:#FFFFFF;--panel-ink2:#6E6E73;--panel-line:rgba(0,0,0,.08);
  --chip:#F2F2F5;--chip-hover:#E8E8ED;
}
@media (prefers-color-scheme: dark){
  :root{--stage-bg:#121214;--stage-ink:#F5F5F7;--panel:#1C1C1F;--panel-ink2:#A1A1A6;--panel-line:rgba(255,255,255,.1);--chip:#2A2A2E;--chip-hover:#34343A}
}
html,body{height:100%}
body{background:var(--stage-bg);color:var(--stage-ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
:focus-visible{outline:3px solid #FF4410;outline-offset:3px}

/* ---------- Stage + demo panel ---------- */
.stage{display:flex;height:100%}
.demo{width:320px;flex:none;background:var(--panel);border-right:1px solid var(--panel-line);padding:24px 20px 32px;overflow-y:auto;z-index:50;transition:transform .3s}
.demo h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.demo p{font-size:13px;color:var(--panel-ink2);line-height:1.45;margin-top:6px}
.demo h3{font-size:13px;font-weight:600;color:var(--panel-ink2);margin:22px 0 8px}
.scn{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:var(--chip);margin-bottom:6px;transition:background .15s}
.scn:hover{background:var(--chip-hover)}
.scn b{display:block;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.scn span{display:block;font-size:12px;color:var(--panel-ink2);margin-top:2px;line-height:1.35}
.dbtn{display:block;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--panel-line);font-size:14px;font-weight:500;text-align:left;margin-bottom:6px}
.dbtn:hover{background:var(--chip)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:12px;background:var(--chip);font-size:14px;cursor:pointer;margin-bottom:6px}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:#C7C7CC;position:relative;cursor:pointer;flex:none;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked{background:#34C759}
.switch input:checked::after{transform:translateX(18px)}
.demo-toggle{display:none;position:fixed;top:12px;left:12px;z-index:60;padding:8px 14px;border-radius:999px;background:var(--panel);color:var(--stage-ink);font-size:14px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.15)}
@media (max-width:900px){
  .demo{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.3)}
  .demo.open{transform:none}
  .demo-toggle{display:block}
}

.device-area{flex:1;display:grid;place-items:center;padding:20px;min-width:0}
.device{position:relative;background:#000;border-radius:34px;box-shadow:0 30px 80px rgba(0,0,0,.28)}

/* ---------- Kiosk (logical 540 × 960) ---------- */
.kiosk{
  --bg:#F5F5F7;--surface:#FFFFFF;--ink:#1D1D1F;--ink2:#6E6E73;--ink3:#AEAEB2;--line:rgba(60,60,67,.13);
  --brand:#FF4410;--brand-press:#DD390A;--brand-soft:#FFEDE6;--brand-ink:#C2330A;
  --green:#248A3D;--green-bg:#E4F5E9;--green-solid:#34C759;--red:#E0261B;
  position:absolute;left:14px;top:14px;width:540px;height:960px;transform-origin:0 0;
  background:var(--bg);color:var(--ink);border-radius:22px;overflow:hidden;overflow:clip;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;
  user-select:none;-webkit-user-select:none
}

.bar{position:absolute;top:0;left:0;right:0;height:76px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 20px;z-index:5}
.back{justify-self:start;display:flex;align-items:center;gap:4px;height:46px;padding:0 18px 0 10px;border-radius:999px;font-size:17px;font-weight:600;color:var(--ink);
  background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 1px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  opacity:0;pointer-events:none;transition:opacity .25s,transform .12s,background .15s}
.back.show{opacity:1;transform:none;pointer-events:auto}
.back:active{transform:scale(.94);background:rgba(255,255,255,.95)}
.back svg{width:24px;height:24px;color:var(--brand)}
.wordmark{font-size:23px;font-weight:800;font-style:italic;letter-spacing:-.02em}
.wordmark span{font-weight:500}
.lang{justify-self:end;position:relative;display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 1px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06)}
.lang button{display:flex;align-items:center;gap:6px;padding:5px 11px 5px 5px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink2);transition:background .2s,color .2s}
.lang{transition:opacity .25s}
.lang.hide{opacity:0;pointer-events:none}
.lang button{position:relative;z-index:1}
.lang button.on{color:var(--ink)}
.lang-thumb{position:absolute;top:4px;bottom:4px;left:0;border-radius:999px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.14),0 3px 10px rgba(0,0,0,.06);
  transition:transform .35s cubic-bezier(.25,.8,.25,1),width .35s cubic-bezier(.25,.8,.25,1)}
.lang button:active{transform:scale(.95)}
.flag{width:26px;height:26px;border-radius:50%;overflow:hidden;display:block;flex:none;position:relative}
.flag::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.flag svg{width:100%;height:100%;display:block}

.screen{position:absolute;top:76px;left:0;right:0;bottom:0;display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateX(28px);transition:opacity .3s ease,transform .4s cubic-bezier(.2,.8,.2,1),visibility 0s .4s}
.screen.active{opacity:1;visibility:visible;transform:none;transition:opacity .3s ease,transform .4s cubic-bezier(.2,.8,.2,1)}
.spacer{flex:1}
.title{font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.025em}

.btn{height:72px;border-radius:20px;width:100%;font-size:21px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s,background .2s;flex:none}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:active{background:var(--brand-press)}
.btn-primary:disabled{background:#DCDCE0;color:#8E8E93;cursor:default;transform:none}
.btn-secondary{background:var(--surface);color:var(--ink)}
.spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite}

/* Welcome */
.welcome{align-items:center;text-align:center;padding:36px 44px 36px}
.w-art{margin-top:40px;width:184px;height:184px;border-radius:50%;background:var(--brand);display:grid;place-items:center;position:relative;color:#fff;flex:none}
.w-art svg{width:84px;height:84px;position:relative}
.display{font-size:48px;line-height:1.04;font-weight:800;letter-spacing:-.035em;margin-top:52px;max-width:420px}
.lead{font-size:20px;line-height:1.4;color:var(--ink2);margin-top:16px;max-width:380px}
.steps{display:flex;margin-top:44px;width:100%}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:15px;font-weight:600;position:relative}
.step i{width:54px;height:54px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-style:normal;box-shadow:0 1px 2px rgba(0,0,0,.06);position:relative;z-index:1}
.step i svg{width:26px;height:26px}
.step:not(:last-child)::after{content:"";position:absolute;top:27px;left:calc(50% + 36px);right:calc(-50% + 36px);height:2px;border-radius:1px;background:#D8D8DD}
.cash-note{font-size:15px;color:var(--ink2);margin-top:18px}

/* Enter */
.enter{align-items:center;text-align:center;padding:20px 44px 32px}
.enter .title{max-width:420px}
.field{margin-top:26px;width:100%;background:var(--surface);border-radius:22px;padding:16px 60px 18px;position:relative;transition:box-shadow .2s;flex:none}
.field.err{box-shadow:0 0 0 2px var(--red)}
.f-label{font-size:15px;color:var(--ink2);font-weight:500;height:20px}
.f-value{font-size:40px;font-weight:600;margin-top:6px;height:50px;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.f-value.long{font-size:32px}
.sheet .f-value.long{font-size:30px}
.f-value .ph{color:#C7C7CC;font-weight:500}
.caret{width:3px;height:38px;background:var(--brand);margin:0 2px;border-radius:2px;animation:blink 1.1s steps(1) infinite;flex:none}
.f-clear{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:#E5E5EA;display:grid;place-items:center;color:#636366;opacity:0;pointer-events:none;transition:opacity .15s}
.f-clear.show{opacity:1;pointer-events:auto}
.f-clear svg{width:16px;height:16px}
.f-err{min-height:48px;font-size:16px;color:var(--red);line-height:1.35;padding-top:10px;font-weight:500;max-width:420px}
.keypad{display:grid;grid-template-columns:repeat(3,88px);gap:14px 32px;justify-content:center}
.key{width:88px;height:88px;border-radius:50%;background:var(--surface);font-size:36px;font-weight:500;display:grid;place-items:center;transition:background .1s,transform .1s;font-variant-numeric:tabular-nums}
.key:active{background:#D1D1D6;transform:scale(.95)}
.key.ghost{background:transparent}
.key.ghost:active{background:rgba(0,0,0,.07)}
.key.ghost svg{width:34px;height:34px}
.key.empty{visibility:hidden}
.key.plus{font-size:38px;font-weight:400}
.key:disabled{opacity:.25;cursor:default;transform:none;background:transparent}
.enter .btn{margin-top:auto}

/* List */
.list-head{padding:12px 28px 0}
.sub{font-size:18px;color:var(--ink2);margin-top:8px;line-height:1.4}
.scroll{flex:1;overflow-y:auto;padding:22px 28px 24px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.group{background:var(--surface);border-radius:22px;overflow:hidden}
.order{display:flex;align-items:center;gap:16px;padding:20px;width:100%;text-align:left;position:relative}
.order+.order::before{content:"";position:absolute;top:0;left:68px;right:0;height:1px;background:var(--line)}
.order:active:not(.off){background:#F2F2F5}
.check{width:32px;height:32px;border-radius:50%;border:2px solid #C7C7CC;display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s;color:#fff}
.check svg{width:18px;height:18px;opacity:0;transform:scale(.4);transition:opacity .2s,transform .2s ease}
.order.sel .check{background:var(--brand);border-color:var(--brand)}
.order.sel .check svg{opacity:1;transform:none}
.order.off{cursor:default}
.order.off .check{border:0;background:#EFEFF4;color:var(--ink2)}
.order.off .check svg{opacity:1;transform:none}
.order.off .o-num,.order.off .o-amt{color:var(--ink3)}
.o-main{flex:1;min-width:0}
.o-num{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.o-meta{font-size:15px;color:var(--ink2);margin-top:3px}
.o-right{text-align:right;flex:none}
.o-amt{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;margin-top:6px}
.pill.paid{background:var(--green-bg);color:var(--green)}
.pill.card{background:var(--brand-soft);color:var(--brand-ink)}
.pill.prep{background:#EFEFF4;color:var(--ink2)}
.add{margin-top:12px;display:flex;align-items:center;gap:16px;padding:20px;width:100%;color:var(--brand);font-size:19px;font-weight:600;text-align:left}
.add i{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center;flex:none}
.add i svg{width:18px;height:18px}
.footer{padding:18px 28px 32px;border-top:1px solid var(--line);background:rgba(245,245,247,.62);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.sum{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;min-height:38px}
.sum span{font-size:18px;color:var(--ink2)}
.sum strong{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sum .allpaid{display:flex;align-items:center;gap:8px;color:var(--green);font-size:19px;font-weight:600}
.sum .allpaid svg{width:22px;height:22px}

/* Pay */
.pay{align-items:center;text-align:center;padding:28px 44px 0}
.amount-l{font-size:17px;color:var(--ink2);margin-top:22px}
.amount{font-size:64px;font-weight:700;letter-spacing:-.035em;margin-top:4px;font-variant-numeric:tabular-nums}
.pay-art{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;width:100%}
.cardart{width:320px;height:300px;transition:transform .15s}
.tapcard{transform:translate(168px,180px) rotate(-14deg)}
.tpulse{display:none}
@keyframes tap{0%,15%{transform:translate(212px,100px) rotate(-14deg)}45%,70%{transform:translate(168px,180px) rotate(-14deg)}100%{transform:translate(212px,100px) rotate(-14deg)}}
.cardart svg{overflow:visible}
@keyframes tpulse{0%,40%{transform:scale(1);opacity:0}50%{opacity:.8}90%,100%{transform:scale(1.35);opacity:0}}
.cardart:active{transform:scale(.96)}
.cardart svg{width:100%;height:100%;display:block}
.big-spin{width:96px;height:96px;border:6px solid #E5E5EA;border-top-color:var(--brand);border-radius:50%;animation:rot .9s linear infinite}
.err-ic{width:104px;height:104px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center}
.err-ic svg{width:52px;height:52px}
.p-hint{font-size:19px;color:var(--ink2);line-height:1.4;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:80px}
.p-hint.wait{padding-bottom:34px;gap:2px;color:var(--ink);font-weight:500}
.chevs{display:flex;flex-direction:column;align-items:center;color:var(--brand);margin-top:6px}
.chevs svg{width:34px;height:18px;opacity:.15;animation:cascade 1.4s ease-in-out infinite}
.chevs svg:nth-child(2){animation-delay:.18s}
.chevs svg:nth-child(3){animation-delay:.36s}
.edge{position:absolute;left:50%;bottom:0;width:260px;height:8px;margin-left:-130px;border-radius:8px 8px 0 0;background:var(--brand);box-shadow:0 0 28px 6px rgba(255,68,16,.4);animation:edgepulse 1.4s ease-in-out infinite}
.back.nochev svg{display:none}
.pay-actions{width:100%;display:flex;flex-direction:column;gap:12px;padding-bottom:32px;margin-top:24px}
.pay-actions:empty{padding:0}

/* Done */
.done{align-items:center;text-align:center;padding:36px 44px 32px}
.okmark{width:104px;height:104px;border-radius:50%;background:var(--green-solid);display:grid;place-items:center;color:#fff;flex:none}
.okmark svg{width:56px;height:56px}
.done .title{margin-top:24px}
.ticket{margin-top:30px;background:var(--surface);border-radius:28px;padding:26px 24px 30px;width:100%}
.ticket small{font-size:17px;color:var(--ink2);font-weight:500}
.ticket .num{font-size:136px;font-weight:800;letter-spacing:-.05em;line-height:1;margin-top:8px;font-variant-numeric:tabular-nums;color:var(--brand)}
.ticket p{font-size:20px;line-height:1.4;margin-top:16px}
.done-orders{font-size:16px;color:var(--ink2);margin-top:20px;font-variant-numeric:tabular-nums}
.reset-note{font-size:15px;color:var(--ink2);margin-top:14px;font-variant-numeric:tabular-nums}

/* Sheet */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.38);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s;z-index:20}
.overlay.open{opacity:1;visibility:visible;transition:opacity .3s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:30px 30px 0 0;padding:12px 40px 32px;transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.8,.2,1);z-index:21;display:flex;flex-direction:column;align-items:center;text-align:center}
.sheet.open{transform:none}
.grabber{width:40px;height:5px;border-radius:3px;background:#C7C7CC}
.sheet-head{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:14px}
.sheet-head h3{font-size:26px;font-weight:700;letter-spacing:-.02em}
.x-btn{width:40px;height:40px;border-radius:50%;background:#E5E5EA;display:grid;place-items:center;color:#636366}
.x-btn svg{width:16px;height:16px}
.sheet .field{margin-top:18px}
.sheet .f-err{min-height:42px}
.sheet .keypad{grid-template-columns:repeat(3,78px);gap:12px 30px}
.sheet .key{width:78px;height:78px;font-size:32px}
.sheet .btn{margin-top:22px}

/* Idle */
.idle{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(0,0,0,.42);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.idle.open{opacity:1;visibility:visible;transition:opacity .3s}
.idle-card{width:400px;background:var(--surface);border-radius:28px;padding:34px 30px 28px;text-align:center}
.idle-card .count{width:84px;height:84px;margin:0 auto;border-radius:50%;border:5px solid var(--brand);display:grid;place-items:center;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.idle-card h3{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:20px}
.idle-card p{font-size:18px;color:var(--ink2);margin-top:8px;line-height:1.4}
.idle-card .btn{margin-top:26px}

@keyframes rot{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes ring{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.55);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes float{from{transform:translateY(-8px) rotate(-3deg)}to{transform:translateY(18px) rotate(-3deg)}}
@keyframes cascade{0%,100%{opacity:.15}40%{opacity:1}}
@keyframes edgepulse{50%{box-shadow:0 0 46px 12px rgba(255,68,16,.6)}}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes flash{0%{background:var(--brand-soft)}100%{background:transparent}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<button class="demo-toggle" id="demoToggle">Testovacie scenáre</button>
<div class="stage">
  <aside class="demo" id="demo">
    <h2>Testovacie scenáre</h2>
    <p>Kliknutím vyplníte číslo do kiosku. Ak je otvorené okno „Pridať objednávku“, číslo sa vyplní tam. Funguje aj klávesnica (čísla, Backspace, Enter).</p>

    <h3>Telefónne číslo</h3>
    <div id="scnPhone"></div>

    <h3>Číslo objednávky</h3>
    <div id="scnOrder"></div>

    <h3>Platba</h3>
    <p style="margin:0 0 8px">Na obrazovke platby ťuknite na kartu = priloženie karty k terminálu.</p>
    <button class="dbtn" id="dTap">Priložiť kartu</button>
    <label class="switch"><span>Ďalšia platba bude zamietnutá</span><input type="checkbox" id="dDecline"></label>

    <h3>Ostatné</h3>
    <button class="dbtn" id="dIdle">Simulovať nečinnosť zákazníka</button>
    <button class="dbtn" id="dReset">Začať odznova</button>
  </aside>

  <main class="device-area" id="area">
    <div class="device" id="device">
      <div class="kiosk" id="kiosk">

        <div class="bgmark" aria-hidden="true"></div>
        <header class="bar">
          <button class="back" id="backBtn"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="backLabel"></span></button>
          <div class="wordmark"><span>Gym</span>Beam</div>
          <div class="lang" role="group" aria-label="Jazyk / Language">
            <span class="lang-thumb" id="langThumb" aria-hidden="true"></span>
            <button data-lang="sk" aria-label="Slovenčina">
              <span class="flag"><svg viewBox="0 0 30 30" preserveAspectRatio="xMidYMid slice"><rect width="30" height="10" fill="#fff"/><rect y="10" width="30" height="10" fill="#0B4EA2"/><rect y="20" width="30" height="10" fill="#EE1C25"/><path d="M5.5 7.2h9.6v7.6c0 3.6-2.8 5.7-4.8 6.9-2-1.2-4.8-3.3-4.8-6.9z" fill="#EE1C25" stroke="#fff" stroke-width="1.2"/><path d="M10.3 9v8.6M8 11.1h4.6M7.3 13.6h6" stroke="#fff" stroke-width="1.3"/><path d="M6.2 17.3c1-.9 2-.9 2.7-.2.7-.9 2-.9 2.8 0 .7-.7 1.7-.7 2.7.2-.6 1.6-2.3 3-4.1 4-1.8-1-3.5-2.4-4.1-4z" fill="#0B4EA2"/></svg></span>SK
            </button>
            <button data-lang="en" aria-label="English">
              <span class="flag"><svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice"><clipPath id="ukc"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ukc)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></svg></span>EN
            </button>
          </div>
        </header>

        <!-- 1 Welcome -->
        <section class="screen welcome active" data-screen="welcome">
          <div class="w-art" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M4.5 8h15l-1.2 12.2a1 1 0 0 1-1 .8H6.7a1 1 0 0 1-1-.8z"/><path d="M8.5 10V6.5a3.5 3.5 0 0 1 7 0V10"/></svg>
          </div>
          <h1 class="display" data-t="welcome_title"></h1>
          <p class="lead" data-t="welcome_lead"></p>
          <div class="steps">
            <div class="step"><i><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="5" r="1.8"/><circle cx="12" cy="5" r="1.8"/><circle cx="18" cy="5" r="1.8"/><circle cx="6" cy="11" r="1.8"/><circle cx="12" cy="11" r="1.8"/><circle cx="18" cy="11" r="1.8"/><circle cx="6" cy="17" r="1.8"/><circle cx="12" cy="17" r="1.8"/><circle cx="18" cy="17" r="1.8"/></svg></i><span data-t="step1"></span></div>
            <div class="step"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M4.5 8h15l-1.2 12.2a1 1 0 0 1-1 .8H6.7a1 1 0 0 1-1-.8z"/><path d="M8.5 10V6.5a3.5 3.5 0 0 1 7 0V10"/></svg></i><span data-t="step3"></span></div>
          </div>
          <div class="spacer"></div>
          <button class="btn btn-primary" id="startBtn" data-t="start"></button>
          <p class="cash-note" data-t="cash_note"></p>
        </section>

        <!-- 2 Enter -->
        <section class="screen enter" data-screen="enter">
          <h2 class="title" data-t="enter_title"></h2>
          <div class="field" id="enterField">
            <div class="f-label" id="enterLabel"></div>
            <div class="f-value" id="enterValue"></div>
            <button class="f-clear" id="enterClear" aria-label="Vymazať"><svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
          </div>
          <div class="f-err" id="enterErr" role="alert"></div>
          <div class="keypad" id="enterPad"></div>
          <button class="btn btn-primary" id="enterBtn"></button>
        </section>

        <!-- 3 Orders -->
        <section class="screen" data-screen="list">
          <div class="list-head">
            <h2 class="title" data-t="list_title"></h2>
          </div>
          <div class="scroll" id="listScroll">
            <div class="group" id="orders"></div>
            <button class="group add" id="addBtn"><i><svg viewBox="0 0 16 16"><path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></i><span data-t="add"></span></button>
          </div>
          <div class="footer">
            <div class="sum" id="sum"></div>
            <button class="btn btn-primary" id="proceedBtn"></button>
          </div>
        </section>

        <!-- 4 Pay -->
        <section class="screen pay" data-screen="pay">
          <h2 class="title" id="payTitle"></h2>
          <div class="amount-l" data-t="pay_total"></div>
          <div class="amount" id="payAmount"></div>
          <div class="pay-art" id="payArt"></div>
          <div class="p-hint" id="payHint"></div>
          <div class="pay-actions" id="payActions"></div>
        </section>

        <!-- 5 Done -->
        <section class="screen done" data-screen="done">
          <div class="okmark" id="okmark"><svg viewBox="0 0 48 48"><path d="M13 25l7.5 7.5L35 17" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <h2 class="title" data-t="done_title"></h2>
          <div class="ticket">
            <small data-t="your_no"></small>
            <div class="num" id="pickNo"></div>
            <p data-t="done_sub"></p>
          </div>
          <div class="spacer"></div>
          <button class="btn btn-primary" id="doneBtn" data-t="done_btn"></button>
          <p class="reset-note" id="resetNote"></p>
        </section>

        <!-- Add order sheet -->
        <div class="overlay" id="overlay"></div>
        <div class="sheet" id="sheet" role="dialog" aria-modal="true">
          <div class="grabber"></div>
          <div class="sheet-head">
            <h3 data-t="sheet_title"></h3>
            <button class="x-btn" id="sheetClose" aria-label="Zavrieť"><svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
          </div>
          <div class="field" id="sheetField">
            <div class="f-label" id="sheetLabel"></div>
            <div class="f-value" id="sheetValue"></div>
            <button class="f-clear" id="sheetClear" aria-label="Vymazať"><svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
          </div>
          <div class="f-err" id="sheetErr" role="alert"></div>
          <div class="keypad" id="sheetPad"></div>
          <button class="btn btn-primary" id="sheetBtn"></button>
        </div>

        <!-- Inactivity -->
        <div class="idle" id="idle" role="alertdialog">
          <div class="idle-card">
            <div class="count" id="idleCount"></div>
            <h3 data-t="idle_title"></h3>
            <p id="idleSub"></p>
            <button class="btn btn-primary" id="idleBtn" data-t="idle_btn"></button>
          </div>
        </div>

      </div>
    </div>
  </main>
</div>

<script>
/* ---------- Mock data ---------- */
const DB = {
  phones: {
    '0912345678': ['01123456', '01123789', '01124001'],
    '0905111222': ['01125100'],
    '0911222333': ['01127000'],
    '0900000000': [],
    '+420777123456': ['01128000']
  },
  orders: {
    '01123456': { status: 'paid',      amount: 40.00, items: 3 },
    '01123789': { status: 'card',      amount: 24.90, items: 1 },
    '01124001': { status: 'preparing', amount: 18.50, items: 2 },
    '01125100': { status: 'paid',      amount: 62.40, items: 4 },
    '01125555': { status: 'card',      amount: 59.90, items: 2 },
    '01126000': { status: 'card',      amount: 12.90, items: 1 },
    '01127000': { status: 'preparing', amount: 33.00, items: 2 },
    '01128000': { status: 'card',      amount: 29.90, items: 2 }
  }
};

const SCENARIOS = {
  phone: [
    { v: '0912345678', d: '3 objednávky: zaplatená, platba kartou, ešte sa pripravuje' },
    { v: '0905111222', d: 'Všetko zaplatené vopred, platba sa preskočí' },

/* ---------- State ---------- */
const state = {
  lang: 'sk', screen: 'welcome',
  main:  { val: '', err: null, loading: false },
  sheet: { val: '', err: null, loading: false, open: false },
  mode: null, list: [], newIds: [],
  payState: 'wait', declineNext: false,
  pickupNo: 41, done: null, doneLeft: 0, doneTimer: null,
  idleOpen: false, idleLeft: 10, lastAct: Date.now()
};

const $ = s => document.querySelector(s);
const t = (k, v = {}) => {
  const s = T[state.lang][k];
  if (typeof s === 'function') return s(v);
  return s.replace(/\{(\w+)\}/g, (m, p) => v[p] ?? '');
};
const money = n => new Intl.NumberFormat(state.lang === 'sk' ? 'sk-SK' : 'en-IE', { style: 'currency', currency: 'EUR' }).format(n);
const CC = ['421','420','380','385','386','359','370','371','372','353','351','36','48','43','49','40','39','44','33','34','30','31','32','45','46','47','41'];
const ccOf = d => CC.find(c => d.startsWith(c)) || null;
const typeOf = s => (s.startsWith('+') || s.startsWith('09')) ? 'phone' : (s.length ? 'order' : 'any');
const group3 = d => (d.match(/.{1,3}/g) || []).join(' ');
const fmt = s => {
  if (s.startsWith('+')) {
    const d = s.slice(1), cc = ccOf(d);
    if (!cc) return '+' + d;
    const rest = d.slice(cc.length);
    return '+' + cc + (rest ? ' ' + group3(rest) : '');
  }
  if (s.startsWith('09')) return [s.slice(0, 4), s.slice(4, 7), s.slice(7, 10)].filter(Boolean).join(' ');
  return s;
};
const ready = s => {
  if (s.startsWith('+')) { const d = s.slice(1); return !!ccOf(d) && d.length >= 11; }
  const k = typeOf(s); return k === 'phone' ? s.length === 10 : k === 'order' ? s.length >= 8 : false;
};
const norm = s => s.startsWith('+421') ? '0' + s.slice(4) : s;
const selected = () => state.list.filter(o => o.sel);
const due = () => selected().filter(o => o.status === 'card').reduce((a, o) => a + o.amount, 0);
const shake = el => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); };

/* ---------- Navigation ---------- */
function go(name) {
  state.screen = name;
  document.querySelectorAll('.screen').forEach(el => el.classList.toggle('active', el.dataset.screen === name));
  if (name === 'done') { const m = $('#okmark'); m.classList.remove('go'); void m.offsetWidth; m.classList.add('go'); }
  if (name === 'list') $('#listScroll').scrollTop = 0;
  state.lastAct = Date.now();
  render();
}

function reset(keepLang) {
  clearInterval(state.doneTimer);
  state.main = { val: '', err: null, loading: false };
  state.sheet = { val: '', err: null, loading: false, open: false };
  state.mode = null; state.list = []; state.newIds = []; state.payState = 'wait'; state.done = null;
  state.idleOpen = false;
  if (!keepLang) state.lang = 'sk';
  go('welcome');
}

/* ---------- Lookup ---------- */
function lookup(s) {
  if (typeOf(s) === 'phone') {
    const ids = DB.phones[norm(s)] || [];
    if (!ids.length) return { err: { key: 'err_phone_none', x: fmt(s) } };
    const items = ids.map(id => ({ id, ...DB.orders[id] }));
    if (!items.some(o => o.status !== 'preparing')) return { err: { key: 'err_phone_prep', x: fmt(s) } };
    return { items };
  }
  const o = DB.orders[s];
  if (!o) return { err: { key: 'err_order_none', x: s } };
  if (o.status === 'preparing') return { err: { key: 'err_preparing', x: s } };
  return { items: [{ id: s, ...o }] };
}

function press(which, k) {
  const st = state[which];
  if (st.loading) return;
  if (k === 'del') st.val = st.val.slice(0, -1);
  else if (k === '+') { if (st.val) return; st.val = '+'; }
  else if (st.val.length < (st.val.startsWith('+') ? 13 : 10)) st.val += k;
  st.err = null;
  renderField(which);
}

function submit(which) {
  const st = state[which];
  if (!ready(st.val) || st.loading) return;
  st.loading = true; renderField(which);
  setTimeout(() => {
    st.loading = false;
    const r = lookup(st.val);
    if (r.err) { st.err = r.err; renderField(which); shake($('#' + (which === 'main' ? 'enter' : 'sheet') + 'Field')); return; }
    if (which === 'main') {
      state.mode = typeOf(st.val);
      state.list = r.items.map(o => ({ ...o, sel: o.status !== 'preparing' }));
      state.newIds = [];
      go('list');
    } else {
      const fresh = r.items.filter(o => !state.list.some(x => x.id === o.id));
      if (!fresh.length) { st.err = { key: 'err_dup', x: fmt(st.val) }; renderField('sheet'); shake($('#sheetField')); return; }
      fresh.forEach(o => state.list.push({ ...o, sel: o.status !== 'preparing' }));
      state.newIds = fresh.map(o => o.id);
      closeSheet();
      renderList();
      const sc = $('#listScroll'); sc.scrollTo({ top: sc.scrollHeight, behavior: 'smooth' });
    }
  }, 650);
}

/* ---------- Sheet ---------- */
function openSheet() { state.sheet = { val: '', err: null, loading: false, open: true }; renderField('sheet'); $('#sheet').classList.add('open'); $('#overlay').classList.add('open'); }
function closeSheet() { state.sheet.open = false; $('#sheet').classList.remove('open'); $('#overlay').classList.remove('open'); }

/* ---------- Payment ---------- */
function proceed() {
  if (!selected().length) return;
  if (due() > 0) { state.payState = 'wait'; go('pay'); }
  else finish();
}
function tapCard() {
  if (state.screen !== 'pay' || state.payState !== 'wait') return;
  state.payState = 'processing'; renderPay();
  setTimeout(() => {
    if (state.screen !== 'pay' || state.payState !== 'processing') return;
    if (state.declineNext) { state.declineNext = false; $('#dDecline').checked = false; state.payState = 'declined'; renderPay(); }
    else finish();
  }, 1800);
}
function finish() {
  state.pickupNo++;
  state.done = { no: state.pickupNo, ids: selected().map(o => o.id) };
  state.doneLeft = 20;
  clearInterval(state.doneTimer);
  state.doneTimer = setInterval(() => { state.doneLeft--; if (state.doneLeft <= 0) reset(); else renderDone(); }, 1000);
  go('done');
}

/* ---------- Render ---------- */
function renderStatic() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === state.lang));
  $('.lang').classList.toggle('hide', state.screen !== 'welcome');
  const on = document.querySelector('.lang button.on'), th = $('#langThumb');
  th.style.width = on.offsetWidth + 'px';
  th.style.transform = `translateX(${on.offsetLeft}px)`;
}

function renderField(which) {
  const st = state[which], p = which === 'main' ? 'enter' : 'sheet';
  $('#' + p + 'Label').textContent = t('label_' + typeOf(st.val));
  $('#' + p + 'Value').innerHTML = st.val
    ? `<span>${fmt(st.val)}</span><span class="caret"></span>`
    : `<span class="caret"></span><span class="ph">${t('placeholder')}</span>`;
  $('#' + p + 'Value').classList.toggle('long', fmt(st.val).length > 12);
  $('#' + p + 'Clear').classList.toggle('show', !!st.val);
  $('#' + p + 'Pad [data-k="+"]').disabled = !!st.val;
  $('#' + p + 'Err').textContent = st.err ? t(st.err.key, { x: st.err.x }) : '';
  $('#' + p + 'Field').classList.toggle('err', !!st.err);
  const btn = $('#' + p + 'Btn');
  btn.disabled = !ready(st.val) && !st.loading;
  btn.innerHTML = st.loading ? '<span class="spin"></span>' : t(which === 'main' ? 'find' : 'sheet_btn');
}

function renderList() {
  $('#orders').innerHTML = state.list.map(o => {
    const off = o.status === 'preparing';
    const pill = off ? `<span class="pill prep">${t('st_prep')}</span>`
      : o.status === 'paid' ? `<span class="pill paid">${t('st_paid')}</span>`
      : `<span class="pill card">${t('st_card')}</span>`;
    return `<button class="order${o.sel ? ' sel' : ''}${off ? ' off' : ''}${state.newIds.includes(o.id) ? ' new' : ''}" data-id="${o.id}" ${off ? 'aria-disabled="true"' : `aria-pressed="${o.sel}"`}>
      <span class="check">${off ? ICON.clock : ICON.check}</span>
      <span class="o-main"><span class="o-num" style="display:block">${o.id}</span><span class="o-meta" style="display:block">${t('items', { n: o.items })}</span></span>
      <span class="o-right"><span class="o-amt" style="display:block">${money(o.amount)}</span>${pill}</span>
    </button>`;
  }).join('');
  state.newIds = [];
  const n = selected().length, d = due();
  $('#sum').innerHTML = !n ? `<span>${t('none_sel')}</span>`
    : d > 0 ? `<span>${t('due')}</span><strong>${money(d)}</strong>`
    : `<span class="allpaid">${ICON.okc}${t('all_paid')}</span>`;
  const btn = $('#proceedBtn');
  btn.disabled = !n;
  btn.textContent = d > 0 ? t('pay_btn', { x: money(d) }) : t('pickup_btn');
}

function renderPay() {
  const s = state.payState;
  $('#payTitle').textContent = s === 'wait' ? t('pay_title') : s === 'processing' ? t('processing') : t('declined_title');
  $('#payAmount').textContent = money(due());
  $('#payArt').innerHTML = s === 'wait' ? `<button class="cardart" id="cardBtn" aria-label="Priložiť kartu">${ICON.card}</button>`
    : s === 'processing' ? '<div class="big-spin" role="status"></div>'
    : `<div class="err-ic">${ICON.bang}</div>`;
  updateBack();
  $('#payHint').style.display = s === 'wait' ? 'none' : '';
  $('#payHint').innerHTML = s === 'wait' ? ''
    : `<span>${s === 'processing' ? t('processing_sub') : t('declined_sub')}</span>`;
  $('#payActions').innerHTML = s === 'declined'
    ? `<button class="btn btn-primary" data-act="retry">${t('retry')}</button><button class="btn btn-secondary" data-act="cancel">${t('cancel')}</button>`
    : s === 'wait' ? `<button class="btn btn-secondary" data-act="cancel">${t('cancel_pay')}</button>` : '<div style="height:72px"></div>';
}

function updateBack() {
  const s = state.screen, pay = s === 'pay';
  const b = $('#backBtn');
  b.classList.toggle('show', s === 'enter' || s === 'list');
  b.classList.toggle('nochev', pay);
  $('#backLabel').textContent = pay ? t('cancel') : t('back');
}

function renderDone() {
  if (!state.done) return;
  $('#pickNo').textContent = state.done.no;
  $('#resetNote').textContent = t('reset_in', { x: state.doneLeft });
}

function renderIdle() {
  $('#idle').classList.toggle('open', state.idleOpen);
  $('#idleCount').textContent = state.idleLeft;
  $('#idleSub').textContent = t('idle_sub', { x: state.idleLeft });
}

function render() {
  renderStatic(); renderField('main'); renderField('sheet');
  renderList(); renderPay(); renderDone(); renderIdle();
}

/* ---------- Keypads ---------- */
function buildPad(el, which) {
  const keys = ['1','2','3','4','5','6','7','8','9','+','0','del'];
  el.innerHTML = keys.map(k => k === '+' ? '<button class="key ghost plus" data-k="+" aria-label="Plus">+</button>'
    : k === 'del' ? `<button class="key ghost" data-k="del" aria-label="Zmazať">${ICON.del}</button>`
    : `<button class="key" data-k="${k}">${k}</button>`).join('');
  el.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) press(which, b.dataset.k); });
}
buildPad($('#enterPad'), 'main');
buildPad($('#sheetPad'), 'sheet');

/* ---------- Events ---------- */
$('#startBtn').onclick = () => go('enter');
$('#backBtn').onclick = () => { if (state.screen === 'enter') reset(true); else if (state.screen === 'list') go('enter'); else if (state.screen === 'pay') go('list'); };
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { state.lang = b.dataset.lang; render(); });
$('#enterBtn').onclick = () => submit('main');
$('#sheetBtn').onclick = () => submit('sheet');
$('#enterClear').onclick = () => { state.main.val = ''; state.main.err = null; renderField('main'); };
$('#sheetClear').onclick = () => { state.sheet.val = ''; state.sheet.err = null; renderField('sheet'); };
$('#addBtn').onclick = openSheet;
$('#sheetClose').onclick = closeSheet;
$('#overlay').onclick = closeSheet;
$('#orders').addEventListener('click', e => {
  const b = e.target.closest('.order'); if (!b) return;
  const o = state.list.find(x => x.id === b.dataset.id);
  if (!o || o.status === 'preparing') return;
  o.sel = !o.sel; renderList();
});
$('#proceedBtn').onclick = proceed;
$('#payArt').addEventListener('click', e => { if (e.target.closest('#cardBtn')) tapCard(); });
$('#payActions').addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.dataset.act === 'retry') { state.payState = 'wait'; renderPay(); }
  else go('list');
});
$('#doneBtn').onclick = () => reset();
$('#idleBtn').onclick = () => { state.idleOpen = false; state.lastAct = Date.now(); renderIdle(); };
$('#kiosk').addEventListener('pointerdown', () => { if (!state.idleOpen) state.lastAct = Date.now(); });

document.addEventListener('keydown', e => {
  const which = state.sheet.open ? 'sheet' : state.screen === 'enter' ? 'main' : null;
  if (e.key === 'Escape' && state.sheet.open) { closeSheet(); return; }
  if (!which) return;
  state.lastAct = Date.now();
  if (/^\d$/.test(e.key) || e.key === '+') press(which, e.key);
  else if (e.key === 'Backspace') press(which, 'del');
  else if (e.key === 'Enter') submit(which);
});

/* Inactivity: 45 s idle on enter/list/pay -> 10 s countdown -> reset */
setInterval(() => {
  if (state.idleOpen) { state.idleLeft--; if (state.idleLeft <= 0) reset(); else renderIdle(); return; }
  const watched = ['enter', 'list', 'pay'].includes(state.screen) && state.payState !== 'processing';
  if (watched && Date.now() - state.lastAct > 45000) { state.idleOpen = true; state.idleLeft = 10; renderIdle(); }
}, 1000);

/* ---------- Demo panel ---------- */
function scnHTML(list) {
  return list.map(s => `<button class="scn" data-v="${s.v}"><b>${fmt(s.v)}</b><span>${s.d}</span></button>`).join('');
}
$('#scnPhone').innerHTML = scnHTML(SCENARIOS.phone);
$('#scnOrder').innerHTML = scnHTML(SCENARIOS.order);
$('#demo').addEventListener('click', e => {
  const b = e.target.closest('.scn'); if (!b) return;
  if (state.sheet.open) { state.sheet.val = b.dataset.v; state.sheet.err = null; renderField('sheet'); }
  else {
    state.idleOpen = false;
    state.main = { val: b.dataset.v, err: null, loading: false };
    state.sheet.open = false; closeSheet();
    go('enter');
  }
  $('#demo').classList.remove('open');
});
$('#dTap').onclick = tapCard;
$('#dDecline').onchange = e => { state.declineNext = e.target.checked; };
$('#dIdle').onclick = () => { if (['enter', 'list', 'pay'].includes(state.screen)) { state.idleOpen = true; state.idleLeft = 10; renderIdle(); } };
$('#dReset').onclick = () => reset();
$('#demoToggle').onclick = () => $('#demo').classList.toggle('open');

/* ---------- Fit kiosk to window ---------- */
function fit() {
  const area = $('#area'), pad = 28;
  const aw = area.clientWidth - 40, ah = area.clientHeight - 40;
  const s = Math.min((aw - pad) / 540, (ah - pad) / 960);
  $('#kiosk').style.transform = `scale(${s})`;
  $('#device').style.width = (540 * s + pad) + 'px';
  $('#device').style.height = (960 * s + pad) + 'px';
}
window.addEventListener('resize', fit);
fit();
render();
</script>
</body>
